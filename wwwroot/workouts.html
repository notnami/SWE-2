<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/workouts.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Workouts</title>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="workouts.html">Workouts</a>
        <a href="calories.html">Calories</a>
        <a href="snacks.html">Snacks</a>
        <a href="favorites.html">Favorites</a>
        <a href="login.html" class="logout">Logout</a>
    </nav>

    <!-- Header -->
    <header>
        <h1>Workout Tracker</h1>
        <p>Track workouts and calories burned</p>
    </header>

    <!-- Add Workout -->
    <section class="workout-form">
        <h2>Add Workout</h2>

        <select id="workout-name">
            <option value="3.5">Walking</option>
            <option value="8">Running</option>
            <option value="6">Cycling</option>
            <option value="3">Yoga</option>
            <option value="10">HIIT</option>
        </select>

        <input type="number" id="duration" placeholder="Duration (minutes)" />

        <button id="addWorkoutBtn">Add Workout</button>
    </section>

    <!-- Workout List -->
    <section class="workout-list">
        <h2>Today's Workouts</h2>
        <ul id="workoutList"></ul>
    </section>

    <!-- Calories -->
    <section class="calories">
        <h2>Total Calories Burned</h2>
        <p id="totalCalories">0 kcal</p>
    </section>

    <script src="js/workouts.js"></script>
</body>
</html>
