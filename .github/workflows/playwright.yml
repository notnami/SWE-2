name: Run .NET Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Start web app
        run: |
          Start-Process -FilePath dotnet -ArgumentList "run","--project","MyFitnessBud.csproj","--urls","http://localhost:5161" -NoWindow
          for ($i = 1; $i -le 30; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:5161 -ErrorAction Stop | Out-Null
              Write-Host "Server is ready"
              break
            } catch {
              Write-Host "Waiting for web app..."
              Start-Sleep -Seconds 2
            }
          }

      - name: Run .NET tests
        run: dotnet test MyFitnessBud.Tests/MyFitnessBud.Tests.csproj --configuration Release --no-restore

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
